<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BananaSMP · Trading Hub</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/spotlight.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="/#market"><img src="/logo.png" alt=""><span>BananaSMP<small>TRADING HUB</small></span></a>
    <div class="header-actions"><div id="navigation-control"></div><div id="notification-control"></div><div id="account-control"><button class="quiet" type="button">Sign in with Discord <span aria-hidden="true">↗</span></button></div></div>
  </div></header>
  <main class="shell" id="main"></main>
  <footer class="shell footer"><span>BananaSMP Trading Hub</span><span>Player-to-player trades · Minecraft Java</span></footer>
  <dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="quiet" id="close" aria-label="Close">×</button></div><div id="dialog-body"></div></dialog>
  <div role="status" id="notice"></div>
</body>
</html>
